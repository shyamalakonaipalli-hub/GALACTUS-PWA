<body><main class="card"><div class="orb">G</div><h1>You're offline</h1><p>GALACTUS has no network connection right now. The saved workspace shell may still be available, but AI services require a connection unless a compatible local runtime is separately configured.</p><button onclick="location.reload()">Try again</button></main></body>
