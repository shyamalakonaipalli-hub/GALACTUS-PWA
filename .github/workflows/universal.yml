name: GALACTUS PWA - Universal Verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify Project
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Show repository information
        run: |
          echo "GALACTUS PWA Universal Verification"
          echo "Branch: $GITHUB_REF_NAME"
          echo "Commit: $GITHUB_SHA"
          find . -maxdepth 3 -type f \
            ! -path './.git/*' | sort | head -200

      - name: Validate ZIP archives
        shell: bash
        run: |
          set -euo pipefail
          found=0

          while IFS= read -r -d '' file; do
            found=1
            echo "Checking ZIP: $file"
            unzip -t "$file"
          done < <(
            find . -type f -name '*.zip' \
              -not -path './.git/*' -print0
          )

          if [ "$found" -eq 0 ]; then
            echo "No ZIP archives found; skipping."
          fi

      - name: Extract ZIP archives for testing
        shell: bash
        run: |
          set -euo pipefail

          export EXTRACT_ROOT="$RUNNER_TEMP/galactus-extracted"
          mkdir -p "$EXTRACT_ROOT"

          count=0

          while IFS= read -r -d '' file; do
            count=$((count + 1))
            target="$EXTRACT_ROOT/archive-$count"
            mkdir -p "$target"

            echo "Extracting: $file"
            unzip -q "$file" -d "$target"
          done < <(
            find . -type f -name '*.zip' \
              -not -path './.git/*' -print0
          )

          echo "EXTRACT_ROOT=$EXTRACT_ROOT" \
            >> "$GITHUB_ENV"

          echo "Extracted $count archive(s)."

      - name: Check Python syntax
        shell: bash
        run: |
          set -euo pipefail
          found=0

          while IFS= read -r -d '' file; do
            found=1
            echo "Checking Python: $file"
            python -m py_compile "$file"
          done < <(
            find . "$EXTRACT_ROOT" \
              -type f -name '*.py' \
              -not -path './.git/*' \
              -not -path '*/__pycache__/*' \
              -not -path '*/.venv/*' \
              -not -path '*/venv/*' \
              -print0
          )

          if [ "$found" -eq 0 ]; then
            echo "No Python files found; skipping."
          fi

      - name: Run Python unit tests
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t test_dirs < <(
            find . "$EXTRACT_ROOT" \
              -type f \
              \( -name 'test_*.py' \
                 -o -name '*_test.py' \) \
              -not -path './.git/*' \
              -not -path '*/__pycache__/*' \
              -not -path '*/.venv/*' \
              -not -path '*/venv/*' \
              -printf '%h\n' | sort -u
          )

          if [ "${#test_dirs[@]}" -eq 0 ]; then
            echo "No Python unit tests found; skipping."
            exit 0
          fi

          for dir in "${test_dirs[@]}"; do
            echo "Running tests in: $dir"

            python -m unittest discover \
              -s "$dir" \
              -p 'test*.py' \
              -v
          done

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          found=0

          while IFS= read -r -d '' file; do
            found=1
            echo "Checking JavaScript: $file"
            node --check "$file"
          done < <(
            find . "$EXTRACT_ROOT" \
              -type f \
              \( -name '*.js' -o -name '*.mjs' \) \
              -not -path './.git/*' \
              -not -path '*/node_modules/*' \
              -not -path '*/__pycache__/*' \
              -print0
          )

          if [ "$found" -eq 0 ]; then
            echo "No JavaScript files found; skipping."
          fi

      - name: Validate PWA manifests
        shell: bash
        run: |
          set -euo pipefail
          found=0

          while IFS= read -r -d '' file; do
            found=1
            echo "Validating manifest: $file"
            python -m json.tool "$file" > /dev/null
          done < <(
            find . "$EXTRACT_ROOT" \
              -type f \
              \( -name 'manifest.json' \
                 -o -name 'manifest.webmanifest' \) \
              -not -path './.git/*' \
              -print0
          )

          if [ "$found" -eq 0 ]; then
            echo "No PWA manifest found; skipping."
          fi

      - name: Verification summary
        if: always()
        run: |
          {
            echo "## GALACTUS PWA Verification"
            echo ""
            echo "- Commit: $GITHUB_SHA"
            echo "- Branch: $GITHUB_REF_NAME"
            echo "- ZIP integrity and extracted source checks"
            echo "- Inspect each step for actual test results."
            echo "- Skipped checks are not passing tests."
            echo "- Live AI inference and physical-device"
            echo "  compatibility require separate testing."
          } >> "$GITHUB_STEP_SUMMARY"
